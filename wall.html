<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Clarity Labs — Response Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f2eee6;--card:#fbf9f4;--ink:#17140f;--soft:#5b554a;--line:#dad3c4;--accent:#e8563a}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif;overflow-x:hidden}
  .shell{min-height:100vh;padding:clamp(24px,4vw,58px);display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:clamp(18px,3vw,34px);border-bottom:1px solid var(--line)}
  .brand{font:500 clamp(18px,2vw,26px) Fraunces}.count{background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 15px;font-size:clamp(12px,1.2vw,16px);font-weight:700}
  .question-wrap{padding:clamp(26px,4vw,52px) 0 clamp(20px,3vw,38px)}.eyebrow{font-size:clamp(10px,1vw,13px);font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);margin-bottom:13px}
  h1{font:400 clamp(38px,6vw,86px)/.98 Fraunces;margin:0;letter-spacing:-.035em;max-width:1200px}
  .answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:clamp(12px,1.6vw,22px);align-content:start}
  .answer{background:var(--card);border:1px solid var(--line);border-radius:clamp(15px,2vw,24px);padding:clamp(19px,2.5vw,34px);font:400 clamp(21px,2.4vw,36px)/1.18 Fraunces;overflow-wrap:anywhere;animation:arrive .45s cubic-bezier(.2,.8,.2,1) both}
  @keyframes arrive{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
  .waiting{flex:1;display:grid;place-items:center;text-align:center;color:var(--soft)}.waiting-inner{max-width:580px}.pulse{width:52px;height:52px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 22px;animation:spin 1.25s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .waiting h1{font-size:clamp(38px,5vw,70px);margin-bottom:14px}.waiting p{font-size:clamp(15px,1.5vw,21px);line-height:1.5;margin:0}.hidden{display:none}
</style>
</head>
<body>
<main class="shell">
  <header><div class="brand">Clarity Labs</div><div class="count"><span id="count">0</span> responses</div></header>
  <section id="waiting" class="waiting"><div class="waiting-inner"><div class="pulse"></div><h1>Waiting for the next question.</h1><p>Audience responses will appear here automatically.</p></div></section>
  <section id="active" class="hidden">
    <div class="question-wrap"><div class="eyebrow">Audience question</div><h1 id="question"></h1></div>
    <div id="answers" class="answers"></div>
  </section>
</main>
<script>
  const waiting=document.getElementById("waiting"),active=document.getElementById("active");
  const question=document.getElementById("question"),answers=document.getElementById("answers"),count=document.getElementById("count");
  let questionId="",loading=false,lastSignature="";
  function escapeHTML(value){return String(value||"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
  function showWaiting(){
    questionId="";lastSignature="";count.textContent="0";active.classList.add("hidden");waiting.classList.remove("hidden");
  }
  function render(items){
    const signature=items.map(item=>`${item.id}:${item.answer}`).join("|");
    count.textContent=items.length;
    if(signature===lastSignature)return;
    lastSignature=signature;
    answers.innerHTML=items.length
      ?items.map(item=>`<article class="answer">${escapeHTML(item.answer)}</article>`).join("")
      :`<article class="answer">Waiting for the first response…</article>`;
  }
  async function refresh(){
    if(loading)return;loading=true;
    try{
      const stateResponse=await fetch("/api/audience-question",{cache:"no-store"});
      const state=await stateResponse.json();
      if(!stateResponse.ok||!state.active||!state.questionId){showWaiting();return}
      if(state.questionId!==questionId){
        questionId=state.questionId;lastSignature="";question.textContent=state.question;
        waiting.classList.add("hidden");active.classList.remove("hidden");
      }
      const response=await fetch(`/api/audience-responses?questionId=${encodeURIComponent(questionId)}`,{cache:"no-store"});
      const data=await response.json();
      if(response.ok)render(Array.isArray(data.responses)?data.responses:[]);
    }catch{}finally{loading=false}
  }
  refresh();setInterval(refresh,1100);
</script>
</body>
</html>
